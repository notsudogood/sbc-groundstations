name: Build and Release
on:
  push:
    branches:
      - master
      # feedback-repair data-gathering build (release job at the bottom)
      - claude/wifi-fpv-link-architecture-1bms9l
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

# The release jobs create/update GitHub releases, which needs the token's
# contents: write. Declared explicitly: a fork's default workflow token is
# read-only (openipc-builder's same-branch run died on "403 Resource not
# accessible by integration" at its release step).
permissions:
  contents: write

env:
  TAG_NAME: latest

# A newer push to the same PR supersedes the running build. Master and
# tag builds are never cancelled, so every release still gets published.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  buildroot:
    name: Build Firmware
    # Pinned: ubuntu-latest moved to 26.04, where qemu-user-static is a
    # virtual package with two providers and `apt install` refuses it
    # (gs20's first run, all three boards). gs19 built on 24.04.
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        platform:
          - radxa_zero3
          - runcam_wifilink
          - emax_wyvern-link

    steps:

      # gs18's first attempt: the emax_wyvern-link job ran out of disk
      # compiling LLVM (and the ccache save failed for the same reason); the
      # rerun passed. Toolchains the build never uses go first.
      - name: Free disk space
        run: |
          df -hT
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -hT

      - name: Checkout source
        uses: actions/checkout@v6

      - name: Prepare firmware
        run: |
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          sudo apt update
          sudo apt install -y cpio rsync bc qemu-user-static binfmt-support
          curl -fsSL https://deb.nodesource.com/setup_24.x | sudo bash -
          sudo apt install -y nodejs
          sudo mkdir -p /mnt/workspace
          sudo chown $USER:$USER /mnt/workspace
          rsync -a "$GITHUB_WORKSPACE/" /mnt/workspace/

      # Unique key per run: actions/cache never re-saves on an exact key
      # hit, so a fixed key freezes the cache at its first save. Restore
      # the newest one by prefix and save a fresh one after every build.
      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: /tmp/ccache
          key: ${{ matrix.platform }}-ccache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ matrix.platform }}-ccache-

      - name: Build firmware
        working-directory: /mnt/workspace
        run: |
          export GIT_HASH=$(git rev-parse --short $GITHUB_SHA)
          export GIT_BRANCH=${GITHUB_REF_NAME}
          echo "GIT_HASH=${GIT_HASH}" >> $GITHUB_ENV
          echo "GIT_BRANCH=${GITHUB_BRANCH}" >> $GITHUB_ENV

          mkdir -p /tmp/ccache
          export BR2_CCACHE_DIR=/tmp/ccache
          # Three boards share the 10 GB repo cache quota
          export CCACHE_MAXSIZE=3G

          NAME=${{ matrix.platform }}
          DEFCONFIG=${NAME}_defconfig bash build.sh

      - name: ccache stats
        if: always()
        working-directory: /mnt/workspace
        run: BR_CACHE_DIR=/tmp/ccache output/${{ matrix.platform }}_defconfig/host/bin/ccache -s || true

      # Save even when the build fails or is cancelled: a half-finished
      # LLVM compile is still worth keeping for the next run.
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: /tmp/ccache
          key: ${{ matrix.platform }}-ccache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload images to workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.platform }}-images-${{ github.sha }}
          path: |
            /mnt/workspace/output/${{ matrix.platform }}_defconfig/images/${{ matrix.platform }}_sdcard.img
            /mnt/workspace/output/${{ matrix.platform }}_defconfig/images/${{ matrix.platform }}_boot.scr
            /mnt/workspace/output/${{ matrix.platform }}_defconfig/images/${{ matrix.platform }}_u-boot.bin
            /mnt/workspace/output/${{ matrix.platform }}_defconfig/images/${{ matrix.platform }}_emmc_bootloader.img
            /mnt/workspace/output/${{ matrix.platform }}_defconfig/images/${{ matrix.platform }}_rootfs.squashfs
            /mnt/workspace/output/${{ matrix.platform }}_defconfig/images/${{ matrix.platform }}.tar.gz
          retention-days: 7

  release-on-master:
    name: Release Latest (on master merge)
    runs-on: ubuntu-latest
    needs: [buildroot]
    # Only master: a push, or a manual run (workflow_dispatch) on master.
    # Never PRs; tags go to release-on-tag.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Create/Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: buildroot-snapshot
          body: |
            Snapshot development build from master branch
            Commit: ${{ github.sha }}
          files: artifacts/**/*
          prerelease: true
          overwrite: true

  # Efficient-link branch: publish its images the way master does, under a
  # fixed tag, so they outlive the 7-day artifact retention and download
  # without a GitHub login. Pairs with openipc-builder's
  # efficient-link-nack-d18 (and d17). Earlier images stay under
  # efficient-link-nack-gs(2..16), efficient-link-genlock(-gs2) and
  # feedback-repair-shadow, -turnaround, -listen.
  release-feedback-repair:
    name: Release efficient-link-nack-gs24 (on its branch)
    runs-on: ubuntu-latest
    needs: [buildroot]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/claude/wifi-fpv-link-architecture-1bms9l'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Create/Update efficient-link-nack-gs24 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: efficient-link-nack-gs24
          body: |
            Efficient-link GS image gs24 (mabur 037c91a3, devourer 464e8a4):
            gs23 plus a fix to the 10 MHz rung. The video-stop rule (gs21)
            read the ~10 s between the drone linking and its camera's first
            frame as a stop, so most drone power-ups went to 10 MHz; it now
            waits for the session's first video. The rule also read signal
            quality in the radio's raw units as dB, so whether it climbed
            back to 20 MHz came down to noise (one bench power-up never did);
            after a video-stop entry it now climbs back after 8 s clean at
            15 dB or better. 15 dB is a judgement, not a measured limit.
            Unflown. Everything else as gs23: the display phase lock on by
            default with the sink named from its EDID, gs21's link changes.
            No wire change: pairs with openipc-builder efficient-link-nack-d20
            and d21. No config change from gs23 or gs22: nothing is reset.
            From gs21 the player bundle changed (maburplay.toml resets once);
            against gs19 both GS bundles changed (maburgs.toml and
            maburplay.toml reset, edited copies in /config/old/, and the
            menu's saved hop/channel/bandwidth choice is cleared).
            Commit: ${{ github.sha }}
          files: artifacts/**/*
          prerelease: true
          overwrite: true

  release-on-tag:
    name: Release Version (on tag)
    runs-on: ubuntu-latest
    needs: [buildroot]
    # Only run when pushing tags
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Create Versioned Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Stable release ${{ github.ref_name }}
            Commit: ${{ github.sha }}
          files: artifacts/**/*
          draft: false
          prerelease: false
